name: Reproduce Track 1A submission
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run the exact judge command with Docker
        run: make run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduced-evidence
          path: track_1a/output/
